<body class="page-news-index">

  <!-- Google Tag Manager (noscript) -->

  <!-- ============================================================
     ヘッダー（TOP と同じグラデーションバー。ナビは TOP の各セクションへ飛ぶ）
     TOP ではメインビジュアルの下にあるが、このページはメインビジュアルが無いので最上部に置く。
     大分の .l-header はもともと position: sticky なので、そのまま画面上端に貼り付いて追従する
     ============================================================ -->
  <header class="l-header">
    <div class="l-header__inner">
      <!-- SP ではこのまとまりが右からのドロワーになる -->
      <div class="l-header__menu" id="global-nav">
        <nav class="l-header__nav" aria-label="グローバルナビゲーション">
          <ul class="l-header__list">
            <li><a href="../">トップ</a></li>
            <li><a href="../#about">九州ふっこう応援割とは</a></li>
            <li><a href="../#discount">割引内容</a></li>
            <li><a href="../#apply">お申込み方法で選ぶ</a></li>
            <!-- FAQ を非表示にしたので、ナビの「よくある質問」も 2026-09-17 にコメントアウト
          <li><a href="../#faq">よくある質問</a></li>
          -->
            <li><a href="#contact">お問い合わせ</a></li>
          </ul>
        </nav>
        <a class="c-btn-header" href="../business/">事業者の方はこちら</a>
      </div>

      <!-- ハンバーガーボタン（SP のみ表示） -->
      <button class="c-hamburger" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="global-nav">
        <span class="c-hamburger__line"></span>
        <span class="c-hamburger__line"></span>
        <span class="c-hamburger__line"></span>
      </button>
    </div>
    <!-- ドロワーを開いたときの暗幕（SP のみ） -->
    <div class="l-header__overlay"></div>
  </header>

  <main>

    <!-- ============================================================
       お知らせ一覧（カンプなし。参考：鹿児島サイト /news/ の構成を流し込み）
       ・中身は TOP のお知らせ（index.html の .p-news__list）をそのままコピーしている。
         お知らせを追加・変更するときは、TOP とこのページの両方を書き換える
       ・1件ずつの組み方（日付／本文・区切りの点線）は TOP と同じ .p-news__item
       ============================================================ -->
    <section class="p-newslist">
      <div class="l-container">
        <h1 class="p-newslist__title">お知らせ</h1>
        <!-- お知らせは CSV（/csv/oita_news.csv）から ../assets/js/news.js が差し込む（2026-10-14 に直書きから移行）。
             トップと同じ CSV を見ているので、中身は常にそろう（コピーして貼り直す必要はない）。
             本文（body）を使うときは data-news-body="true" を足す -->
        <dl class="p-newslist__list" data-news-csv="/csv/oita_news.csv" data-news-body="true"></dl>
      </div>
    </section>

    <!-- ============================================================
       お問い合わせ（TOP と同じ内容）
       ============================================================ -->
    <section class="p-contact" id="contact">
      <div class="l-container">
        <h2 class="c-heading">お問い合わせ</h2>
        <div class="p-contact__body">
          <p class="p-contact__logo">
            <img loading="lazy" src="../assets/img/common/logo-footer.png" width="578" height="356"
              alt="旅して、湯ったり おおいた 九州ふっこう応援割">
          </p>
          <dl class="p-contact__list">
            <div class="p-contact__row">
              <dt>お問い合わせ先</dt>
              <dd>九州ふっこう応援割おおいた<br>コールセンター</dd>
            </div>
            <div class="p-contact__row">
              <dt>電話番号</dt>
              <dd><a class="p-contact__tel" href="tel:05017324651">050-1732-4651</a></dd>
            </div>
            <div class="p-contact__row">
              <dt>受付時間</dt>
              <dd>9:30〜17:30<span class="p-contact__sub">(土日祝も受付)</span></dd>
            </div>
          </dl>
        </div>
        <p class="p-contact__env"><a href="/accessibility/">推奨環境について</a></p>
      </div>
    </section>

  </main>

  <!-- ============================================================
     フッター
     ============================================================ -->

        stroke-linejoin="round" />
    </svg>
    <span class="c-pagetop__text">ページTOP</span>
  </button>

  <script src="../assets/js/main.js"></script>
